version: "1"
nodes:
  - id: apply-nuxt-ui-migrations
    name: Apply Nuxt UI v4 Migration Rules
    type: automatic
    runtime:
      type: direct
    steps:
      - name: "Replace @nuxt/ui-pro imports with @nuxt/ui in CSS files"
        ast-grep:
          include:
            - "**/*.css"
            - "**/*.scss"
            - "**/*.sass"
          exclude:
            - "**/node_modules/**"
            - "**/fixtures/**"
          base_path: "."
          config_file: "rules/replace-css-imports.yml"
      
      - name: "Replace @nuxt/ui-pro module with @nuxt/ui in nuxt.config.ts"
        ast-grep:
          include:
            - "**/nuxt.config.ts"
            - "**/nuxt.config.js"
          exclude:
            - "**/node_modules/**"
            - "**/fixtures/**"
          base_path: "."
          config_file: "rules/replace-nuxt-config-module.yml"
      
      - name: "Merge uiPro config into ui section in app.config.ts"
        js-ast-grep:
          js_file: "scripts/merge-uipro-to-ui.ts"
          include:
            - "**/app.config.ts"
            - "**/app.config.js"
          exclude:
            - "**/node_modules/**"
            - "**/fixtures/**"
          base_path: "."
          language: "typescript"
      
      - name: "Replace @nuxt/ui-pro dependency with @nuxt/ui in package.json"
        ast-grep:
          include:
            - "**/package.json"
          exclude:
            - "**/node_modules/**"
            - "**/fixtures/**"
          base_path: "."
          config_file: "rules/replace-package-dependency.yml"